  <style>
    @font-face {
      font-family: 'Sifonn Pro';
      src: url('/SIFONN_PRO.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* clip, not hidden: hidden makes body a scroll container, which on iOS
       Safari lets position:fixed bars drift while scrolling. hidden stays as
       the fallback for browsers without clip. */
    html, body { margin: 0; padding: 0; overflow-x: hidden; overflow-x: clip; }
    /* Before the app loads: the saved theme's background (light unless they
       chose dark), then the app's own --t-bg once it has set it. */
    :root { --gf-boot-bg: #f8f9ff; }
    :root.gf-boot-dark { --gf-boot-bg: #06071a; }
    html { background: var(--t-bg, var(--gf-boot-bg)); min-height: 100%; }
    body {
      background: var(--t-bg, var(--gf-boot-bg));
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    }
    #root { background: var(--t-bg, var(--gf-boot-bg)); min-height: 100dvh; }
    button, input, textarea, select {
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    }
  </style>
  <script>try { if (localStorage.getItem('gf-theme') === 'dark') document.documentElement.classList.add('gf-boot-dark') } catch (e) {}</script>
