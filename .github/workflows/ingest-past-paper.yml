name: Ingest exam paper

# Manually triggered (Actions tab → this workflow → "Run workflow").
# Loads a whole exam paper into the bank for the exam builder: an official past
# exam (e.g. VCAA) or a commercial trial exam. Reads both sections (multiple
# choice, and short/extended answer with parts and marks), files each question
# under the subject's course topics, crops figures from the pages, and takes
# answers and worked solutions from the solutions PDF when one is given.
# Re-running the same paper updates its questions instead of adding copies.
#
# Requires repository secrets:
#   SUPABASE_SERVICE_KEY — Supabase service_role key
#   ANTHROPIC_API_KEY    — Anthropic API key
# Optional repository variable:
#   INGEST_MODEL         — overrides the extraction model (default claude-opus-5-5)
#
# PDFs: a public URL, or a path in the Supabase admin-uploads bucket.
# Run in dry-run first: it lists every question it found with its topic,
# parts and marks, without saving anything.
#
# Several papers at once: upload them on Admin → Exam papers, then paste the
# batch ID into the first box and leave the paper details empty. Each paper's
# result shows on that admin page.

on:
  workflow_dispatch:
    inputs:
      pdf:
        description: "Batch ID from Admin → Exam papers, or one exam paper PDF (public URL or admin-uploads path)"
        type: string
        required: true
      solutions:
        description: "Solutions / assessment report PDF (optional): URL or admin-uploads path"
        type: string
        default: ""
      subject:
        description: "Single paper only: subject, exactly as in Admin → Curricula (e.g. 'VCE Mathematical Methods Units 3 and 4')"
        type: string
        default: ""
      kind:
        description: "Official past exam or commercial trial exam"
        type: choice
        options:
          - official
          - commercial
        default: official
      publisher:
        description: "Publisher (e.g. VCAA, SACE Board, NEAP, Insight, Kilbaha)"
        type: string
        default: ""
      year:
        description: "Year of the paper (e.g. 2023)"
        type: string
        default: ""
      paper:
        description: "Which paper (e.g. 'Exam 1', 'Exam 2'); questions from different papers are never mixed"
        type: string
        default: ""
      topic:
        description: "Force every question onto this topic (optional; blank = file each question by its content)"
        type: string
        default: ""
      mode:
        description: "Mode"
        type: choice
        options:
          - "dry-run (report only, no writes)"
          - "apply (save to the live bank)"
        default: "dry-run (report only, no writes)"
      limit:
        description: "Max questions (blank = all; for a quick test)"
        type: string
        default: ""

concurrency:
  group: ingest-exam-paper
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest
        env:
          PDF: ${{ inputs.pdf }}
          SOLUTIONS: ${{ inputs.solutions }}
          SUBJECT: ${{ inputs.subject }}
          KIND: ${{ inputs.kind }}
          PUBLISHER: ${{ inputs.publisher }}
          YEAR: ${{ inputs.year }}
          PAPER: ${{ inputs.paper }}
          TOPIC: ${{ inputs.topic }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INGEST_MODEL: ${{ vars.INGEST_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_KEY secret is not set."
            exit 1
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            exit 1
          fi
          ARGS=("--pdf" "$PDF" "--kind" "$KIND")
          if [ -n "${SUBJECT// /}" ]; then ARGS+=("--subject" "$SUBJECT"); fi
          if [ -n "${PUBLISHER// /}" ]; then ARGS+=("--publisher" "$PUBLISHER"); fi
          if [ -n "${YEAR// /}" ]; then ARGS+=("--year" "$YEAR"); fi
          if [ -n "${PAPER// /}" ]; then ARGS+=("--paper" "$PAPER"); fi
          if [ -n "${SOLUTIONS// /}" ]; then ARGS+=("--solutions" "$SOLUTIONS"); fi
          if [ -n "${TOPIC// /}" ]; then ARGS+=("--topic" "$TOPIC"); fi
          if [ -n "${LIMIT// /}" ]; then ARGS+=("--limit" "$LIMIT"); fi
          case "$MODE" in
            apply*) ARGS+=("--apply") ;;
          esac
          echo "Running ingest with args: ${ARGS[*]}"
          pnpm --filter @workspace/scripts run ingest:past-paper -- "${ARGS[@]}"
